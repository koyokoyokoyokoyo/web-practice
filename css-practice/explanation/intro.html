<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>intro testing</title>
        <link rel="stylesheet" href="./styleintro.css">
    </head>

    <body>
        <!-- Class selector -->
        <div class="alert-text">please agree</div>

        <!-- ID selector -->
         <div id="title">My Movie 1</div>
         <div class="read">read</div>
         <div class="unread">unread</div>

         <!-- chaining selectors -->
         <div>
            <div class="subsection header">Latest post</div>
            <p class="subsection preview">preview post</p>
         </div>
         <!-- it's important to note that
          selector's of different types 
          cannot be cahined -->
          
    </body>
</html>
